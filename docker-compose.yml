# =====================================================
# 在线作业系统 Docker Compose（生产部署）
# 用法：
#   cp .env.example .env   # 按需修改 DB_PASSWORD / JWT_SECRET / AI / 邮箱配置
#   docker compose up -d --build
# 访问 http://<服务器IP>:8080
# =====================================================
services:
  mysql:
    image: mariadb:10.4
    container_name: homework-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-homework123456}
      MYSQL_DATABASE: homework_system
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: homework-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库连接（compose 服务名 mysql；host/port 已在 application.yml 环境变量化）
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_PASSWORD: ${DB_PASSWORD:-homework123456}
      # 生产 JWT 密钥（务必覆盖默认值；所有已签发 token 在更换后失效）
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production-2026}
      # 生产 SQL 日志静默（开发默认 StdOutImpl 看 SQL，压测/生产用 Slf4jImpl）
      MYBATIS_LOG_IMPL: org.apache.ibatis.logging.slf4j.Slf4jImpl
      TZ: Asia/Shanghai
      # AI 出题（可选，不设则 AI 生成提示"AI 服务未配置"）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 邮箱注册验证码（可选，不设则注册发码失败）
      MAIL_AUTH_CODE: ${MAIL_AUTH_CODE:-}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data   # AI 课件材料 + 题干图片（question-images/ai-materials）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  mysql-data:    # MySQL 数据（库表持久化）
  app-data:      # 应用数据（data/ai-materials + data/question-images）
