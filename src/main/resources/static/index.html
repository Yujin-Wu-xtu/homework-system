<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线作业系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa}
        .login-container{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
        .login-card{width:420px;padding:40px;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .login-card h1{text-align:center;margin-bottom:30px;color:#303133;font-size:24px}
        .main-header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .main-header h2{font-size:18px;color:#303133}
        .main-layout{display:flex;min-height:calc(100vh - 56px)}
        .sidebar{width:220px;background:#304156;color:#fff;padding:12px 0}
        .sidebar .el-menu{background:transparent;border:none}
        .sidebar .el-menu-item{color:#bfcbd9}
        .sidebar .el-menu-item:hover,.sidebar .el-menu-item.is-active{background:#263445;color:#409eff}
        .content{padding:20px;flex:1;overflow-y:auto}
        .stat-cards{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
        .stat-card{flex:1;min-width:160px;padding:20px;background:#fff;border-radius:8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .2s}
        .stat-card:hover{transform:translateY(-2px)}
        .stat-card .num{font-size:32px;font-weight:700;color:#409eff}
        .stat-card .label{font-size:13px;color:#909399;margin-top:4px}
        .section-card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
        .section-card h3{margin-bottom:16px;font-size:16px;color:#303133;border-bottom:2px solid #409eff;padding-bottom:8px}
        [v-cloak]{display:none}
    </style>
</head>
<body>
<div id="app" v-cloak>
    <router-view></router-view>
</div>

<script>
const { createApp, ref, reactive, computed, watch, defineComponent, onMounted, nextTick, toRefs } = Vue
const { createRouter, createWebHistory, useRouter, useRoute } = VueRouter

// ======== Axios 配置 ========
axios.defaults.baseURL = ''
axios.interceptors.request.use(c => {
    const t = localStorage.getItem('token')
    if (t) c.headers.Authorization = 'Bearer ' + t
    return c
})
axios.interceptors.response.use(r => r, err => {
    if (err.response?.status === 401) { localStorage.clear(); location.reload() }
    return Promise.reject(err)
})

const $m = (msg, type='success') => ElementPlus.ElMessage[type](msg)
const $c = (msg, title='提示') => ElementPlus.ElMessageBox.confirm(msg, title, {type:'warning'})
const TYPE_MAP = {SINGLE_CHOICE:'单选题',MULTI_CHOICE:'多选题',TRUE_FALSE:'判断题',ESSAY:'问答题'}
const DIFF_MAP = {EASY:{label:'简单',type:'success'},MEDIUM:{label:'中等',type:'warning'},HARD:{label:'困难',type:'danger'}}

const api = {
    login: d => axios.post('/api/auth/login', d),
    profile: () => axios.get('/api/auth/me'),
    updateProfile: d => axios.put('/api/auth/profile', d),
    changePassword: d => axios.put('/api/auth/password', d),
    dashboard: () => axios.get('/api/admin/dashboard'),
    // Admin - Teachers
    teachers: p => axios.get('/api/admin/teachers', {params: p}),
    addTeacher: d => axios.post('/api/admin/teachers', d),
    updateTeacher: (id, d) => axios.put('/api/admin/teachers/' + id, d),
    deleteTeacher: id => axios.delete('/api/admin/teachers/' + id),
    resetTeacherPwd: id => axios.put('/api/admin/teachers/' + id + '/reset-pwd'),
    // Admin - Classes
    classes: p => axios.get('/api/admin/classes', {params: p}),
    addClass: d => axios.post('/api/admin/classes', d),
    updateClass: (id, d) => axios.put('/api/admin/classes/' + id, d),
    deleteClass: id => axios.delete('/api/admin/classes/' + id),
    classStudents: (id, p) => axios.get('/api/admin/classes/' + id + '/students', {params: p}),
    transferStudent: (cid, sid, d) => axios.put(`/api/admin/classes/${cid}/students/${sid}/transfer`, d),
    importStudents: (file, clazzId) => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/students/import?clazzId=' + clazzId, fd) },
    addStudent: d => axios.post('/api/admin/students', d),
    deleteStudent: id => axios.delete('/api/admin/students/' + id),
    // Admin - Questions
    questions: p => axios.get('/api/admin/questions', {params: p}),
    addQuestion: d => axios.post('/api/admin/questions', d),
    updateQuestion: (id, d) => axios.put('/api/admin/questions/' + id, d),
    deleteQuestion: id => axios.delete('/api/admin/questions/' + id),
    questionOptions: id => axios.get('/api/admin/questions/' + id + '/options'),
    questionKps: id => axios.get('/api/admin/questions/' + id + '/knowledge-points'),
    checkDuplicate: d => axios.post('/api/admin/questions/check-duplicate', d),
    toggleQuestion: id => axios.put('/api/admin/questions/' + id + '/status'),
    importQuestions: file => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/questions/import', fd) },
    // Admin - Knowledge Points
    knowledgePoints: k => axios.get('/api/admin/knowledge-points', {params: {keyword: k || ''}}),
    addKnowledgePoint: d => axios.post('/api/admin/knowledge-points', d),
    updateKnowledgePoint: (id, d) => axios.put('/api/admin/knowledge-points/' + id, d),
    deleteKnowledgePoint: id => axios.delete('/api/admin/knowledge-points/' + id),
    // Admin - Teaching Classes
    adminTeachingClasses: p => axios.get('/api/admin/teaching-classes', {params: p}),
    addAdminTeachingClass: d => axios.post('/api/admin/teaching-classes', d),
    updateAdminTeachingClass: (id, d) => axios.put('/api/admin/teaching-classes/' + id, d),
    deleteAdminTeachingClass: id => axios.delete('/api/admin/teaching-classes/' + id),
    adminTeachingClassDetail: id => axios.get('/api/admin/teaching-classes/' + id),
    // Admin - Students
    resetStudentPwd: id => axios.put('/api/admin/students/' + id + '/reset-pwd'),
    // Teacher
    teacherClasses: p => axios.get('/api/teacher/classes', {params: p}),
    teacherTeachingClasses: p => axios.get('/api/teacher/teaching-classes', {params: p}),
    addTeachingClass: d => axios.post('/api/teacher/teaching-classes', d),
    updateTeachingClass: (id, d) => axios.put('/api/teacher/teaching-classes/' + id, d),
    deleteTeachingClass: id => axios.delete('/api/teacher/teaching-classes/' + id),
    teachingClassDetail: id => axios.get('/api/teacher/teaching-classes/' + id),
    teachingClassAddClasses: (id, d) => axios.post(`/api/teacher/teaching-classes/${id}/classes`, d),
    teachingClassRemoveClass: (id, cid) => axios.delete(`/api/teacher/teaching-classes/${id}/classes/${cid}`),
    teachingClassStudents: id => axios.get('/api/teacher/teaching-classes/' + id + '/students'),
    resetTcStudentPwds: id => axios.put('/api/teacher/teaching-classes/' + id + '/reset-student-pwds'),
    teacherHomeworks: p => axios.get('/api/teacher/homeworks', {params: p}),
    assignHomework: d => axios.post('/api/teacher/homeworks', d),
    deleteHomework: id => axios.delete('/api/teacher/homeworks/' + id),
    homeworkDetail: id => axios.get('/api/teacher/homeworks/' + id + '/detail'),
    homeworkSubmissions: id => axios.get('/api/teacher/homeworks/' + id + '/submissions'),
    gradingList: (id, p) => axios.get('/api/teacher/homeworks/' + id + '/grading', {params: p}),
    submissionAnswers: (hwId, subId) => axios.get(`/api/teacher/homeworks/${hwId}/submissions/${subId}/answers`),
    searchQuestions: p => axios.get('/api/teacher/questions/search', {params: p}),
    gradeAnswer: (hwId, ansId, d) => axios.put(`/api/teacher/homeworks/${hwId}/grading/${ansId}`, d),
    exportGrades: id => axios.get('/api/teacher/homeworks/' + id + '/export', {responseType: 'blob'}),
    // Student
    studentHomeworks: p => axios.get('/api/student/homeworks', {params: p}),
    studentHomeworkDetail: id => axios.get('/api/student/homeworks/' + id),
    submitHomework: (id, d) => axios.post('/api/student/homeworks/' + id + '/submit', d),
    homeworkResult: id => axios.get('/api/student/homeworks/' + id + '/result'),
}

// ======== Admin Dashboard ========
const AdminDashboard = defineComponent({
    template: `
        <div>
            <div class="stat-cards">
                <div class="stat-card" v-for="s in stats" :key="s.label">
                    <div class="num">{{ s.value }}</div><div class="label">{{ s.label }}</div>
                </div>
            </div>
            <div class="section-card"><h3>系统总览</h3>
                <p style="color:#909399">当前系统运行正常。请使用左侧菜单进行管理操作。</p>
            </div>
        </div>`,
    setup() {
        const stats = ref([{label:'班级数',value:0},{label:'学生数',value:0},{label:'教师数',value:0},{label:'题库数',value:0},{label:'作业数',value:0},{label:'知识点数',value:0}])
        const keys = ['classCount','studentCount','teacherCount','questionCount','homeworkCount','knowledgePointCount']
        onMounted(async () => {
            try { const r = await api.dashboard(); const d = r.data.data; stats.value.forEach((s,i) => s.value = d[keys[i]] || 0) } catch(e) { console.error('Dashboard load failed', e) }
        })
        return { stats }
    }
})

// ======== Admin Teachers ========
const AdminTeachers = defineComponent({
    template: `
        <div class="section-card"><h3>教师管理 <el-button type="primary" size="small" @click="showAdd">新增教师</el-button></h3>
            <el-input v-model="keyword" placeholder="搜索姓名/工号" size="small" style="width:240px;margin-right:8px" clearable @clear="load"/>
            <el-button size="small" @click="load">搜索</el-button>
            <el-table :data="list" style="margin-top:12px" border stripe>
                <el-table-column prop="id" label="ID" width="60"/>
                <el-table-column prop="username" label="工号" width="120"/>
                <el-table-column prop="realName" label="姓名" width="100"/>
                <el-table-column prop="phone" label="手机号" width="140"/>
                <el-table-column prop="email" label="邮箱"/>
                <el-table-column prop="status" label="状态" width="80">
                    <template #default="{row}"><el-tag :type="row.status==='ACTIVE'?'success':'danger'" size="small">{{row.status}}</el-tag></template>
                </el-table-column>
                <el-table-column label="操作" width="240">
                    <template #default="{row}">
                        <el-button size="small" @click="edit(row)">编辑</el-button>
                        <el-button size="small" type="warning" @click="resetPwd(row.id)">重置密码</el-button>
                        <el-button size="small" type="danger" @click="del(row.id)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-dialog :title="dialogTitle" v-model="dialogVisible" width="460px">
                <el-form :model="form" label-width="80px">
                    <el-form-item label="工号"><el-input v-model="form.username"/></el-form-item>
                    <el-form-item label="姓名"><el-input v-model="form.realName"/></el-form-item>
                    <el-form-item label="手机号"><el-input v-model="form.phone"/></el-form-item>
                    <el-form-item label="邮箱"><el-input v-model="form.email"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="dialogVisible=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
            </el-dialog>
        </div>`,
    setup() {
        const list = ref([]), keyword = ref(''), dialogVisible = ref(false), isEdit = ref(false), form = reactive({username:'',realName:'',phone:'',email:''})
        const dialogTitle = computed(() => isEdit.value?'编辑教师':'新增教师')
        const load = async () => { try { const r = await api.teachers({page:1,size:100,keyword:keyword.value}); list.value = r.data.data.records } catch(e) { console.error(e) } }
        const showAdd = () => { Object.assign(form, {username:'',realName:'',phone:'',email:''}); isEdit.value = false; dialogVisible.value = true }
        const edit = row => { Object.assign(form, row); isEdit.value = true; dialogVisible.value = true }
        const save = async () => { try { isEdit.value ? await api.updateTeacher(form.id, form) : await api.addTeacher(form); dialogVisible.value = false; load(); $m(isEdit.value?'修改成功':'新增成功') } catch(e) { $m(e.response?.data?.msg||'操作失败','error') } }
        const del = id => { $c('确定删除该教师？').then(async ()=>{ await api.deleteTeacher(id); load(); $m('已删除') }).catch(()=>{}) }
        const resetPwd = async id => { try { const r = await api.resetTeacherPwd(id); $m('新密码：'+r.data.data?.newPassword) } catch(e) { console.error(e) } }
        onMounted(load)
        return { list, keyword, dialogVisible, dialogTitle, form, showAdd, edit, save, del, resetPwd, load }
    }
})

// ======== Admin Classes ========
const AdminClasses = defineComponent({
    template: `
        <div class="section-card"><h3>班级管理 <el-button type="primary" size="small" @click="showAdd">新增班级</el-button></h3>
            <el-table :data="list" border stripe>
                <el-table-column prop="id" label="ID" width="60"/>
                <el-table-column prop="name" label="班级名称"/>
                <el-table-column prop="grade" label="年级" width="100"/>
                <el-table-column prop="major" label="专业" width="150"/>
                <el-table-column label="操作" width="280">
                    <template #default="{row}">
                        <el-button size="small" @click="viewStudents(row)">查看学生</el-button>
                        <el-button size="small" @click="edit(row)">编辑</el-button>
                        <el-button size="small" type="danger" @click="del(row.id)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-dialog title="新增班级" v-model="dialogVisible" width="460px">
                <el-form :model="form" label-width="80px">
                    <el-form-item label="班级名称"><el-input v-model="form.name" placeholder="如: 2024级软件工程1班"/></el-form-item>
                    <el-form-item label="年级"><el-input v-model="form.grade" placeholder="如: 2024级"/></el-form-item>
                    <el-form-item label="专业"><el-input v-model="form.major" placeholder="如: 软件工程"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="dialogVisible=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
            </el-dialog>
            <el-dialog title="编辑班级" v-model="editVisible" width="460px">
                <el-form :model="editForm" label-width="80px">
                    <el-form-item label="班级名称"><el-input v-model="editForm.name"/></el-form-item>
                    <el-form-item label="年级"><el-input v-model="editForm.grade"/></el-form-item>
                    <el-form-item label="专业"><el-input v-model="editForm.major"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="editVisible=false">取消</el-button><el-button type="primary" @click="saveEdit">保存</el-button></template>
            </el-dialog>
            <el-dialog title="班级学生" v-model="studentVisible" width="700px">
                <div style="margin-bottom:8px"><el-upload :show-file-list="false" :before-upload="f=>uploadStudents(f)" accept=".xlsx"><el-button size="small" type="success">导入学生Excel</el-button></el-upload></div>
                <el-table :data="students" border stripe max-height="400">
                    <el-table-column prop="username" label="学号" width="120"/>
                    <el-table-column prop="realName" label="姓名" width="100"/>
                    <el-table-column prop="phone" label="手机号" width="140"/>
                    <el-table-column prop="email" label="邮箱"/>
                </el-table>
            </el-dialog>
        </div>`,
    setup() {
        const list = ref([]), dialogVisible = ref(false), editVisible = ref(false), studentVisible = ref(false)
        const form = reactive({name:'',grade:'',major:''}), editForm = reactive({id:null,name:'',grade:'',major:''})
        const students = ref([]), currentClazzId = ref(null)
        const load = async () => { try { const r = await api.classes({page:1,size:100}); list.value = r.data.data.records } catch(e) { console.error(e) } }
        const showAdd = () => { Object.assign(form, {name:'',grade:'',major:''}); dialogVisible.value = true }
        const save = async () => { try { await api.addClass(form); dialogVisible.value = false; load(); $m('新增成功') } catch(e) { $m(e.response?.data?.msg||'失败','error') } }
        const edit = row => { Object.assign(editForm, row); editVisible.value = true }
        const saveEdit = async () => { try { await api.updateClass(editForm.id, editForm); editVisible.value = false; load(); $m('修改成功') } catch(e) { $m(e.response?.data?.msg||'失败','error') } }
        const del = id => { $c('确定删除该班级？').then(async ()=>{ await api.deleteClass(id); load(); $m('已删除') }).catch(()=>{}) }
        const viewStudents = async row => { currentClazzId.value = row.id; studentVisible.value = true; try { const r = await api.classStudents(row.id, {page:1,size:200}); students.value = r.data.data.records } catch(e) { console.error(e) } }
        const uploadStudents = file => {
            api.importStudents(file, currentClazzId.value).then(r => {
                const d = r.data.data
                if (d.errors && d.errors.length) {
                    const lines = d.errors.slice(0, 10).map(e => `第${e.row}行：${e.msg}`).join('\n')
                    ElementPlus.ElMessageBox.alert(`导入校验未通过（共 ${d.errors.length} 条错误），未导入任何学生：\n\n${lines}${d.errors.length > 10 ? `\n…其余 ${d.errors.length - 10} 条略` : ''}`, '导入排错', { type: 'error' })
                } else {
                    $m(`成功导入 ${d.imported} 名学生`)
                    viewStudents({id: currentClazzId.value})
                }
            }).catch(e => $m(e.response?.data?.msg || '导入失败', 'error'))
            return false
        }
        onMounted(load)
        return { list, dialogVisible, editVisible, studentVisible, form, editForm, students, showAdd, save, edit, saveEdit, del, viewStudents, uploadStudents }
    }
})

// ======== Admin Students ========
const AdminStudents = defineComponent({
    template: `
        <div class="section-card"><h3>学生管理
            <el-button type="primary" size="small" :disabled="!selectedClazzId" @click="showAdd">新增学生</el-button>
        </h3>
            <el-form :inline="true"><el-form-item label="选择班级">
                <el-select v-model="selectedClazzId" placeholder="请选择班级" @change="loadStudents" clearable size="small" style="width:220px">
                    <el-option v-for="c in classList" :key="c.id" :label="c.name" :value="c.id"/>
                </el-select>
            </el-form-item></el-form>
            <el-table :data="students" border stripe v-if="selectedClazzId">
                <el-table-column prop="username" label="学号" width="140"/>
                <el-table-column prop="realName" label="姓名" width="120"/>
                <el-table-column prop="phone" label="手机号" width="140"/>
                <el-table-column prop="email" label="邮箱"/>
                <el-table-column prop="status" label="状态" width="80">
                    <template #default="{row}"><el-tag :type="row.status==='ACTIVE'?'success':'danger'" size="small">{{row.status==='ACTIVE'?'正常':'禁用'}}</el-tag></template>
                </el-table-column>
                <el-table-column label="操作" width="280">
                    <template #default="{row}">
                        <el-button size="small" @click="showTransfer(row)">转班</el-button>
                        <el-button size="small" type="warning" @click="resetPwd(row.id)">重置密码</el-button>
                        <el-button size="small" type="danger" @click="del(row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <p v-else style="color:#909399">请先选择一个班级查看学生</p>
            <el-dialog title="新增学生" v-model="addVisible" width="460px">
                <el-form :model="addForm" label-width="80px">
                    <el-form-item label="学号"><el-input v-model="addForm.username" placeholder="必填，如 20240007"/></el-form-item>
                    <el-form-item label="姓名"><el-input v-model="addForm.realName" placeholder="必填"/></el-form-item>
                    <el-form-item label="手机号"><el-input v-model="addForm.phone"/></el-form-item>
                    <el-form-item label="邮箱"><el-input v-model="addForm.email"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="addVisible=false">取消</el-button><el-button type="primary" @click="saveAdd">保存</el-button></template>
            </el-dialog>
            <el-dialog title="学生转班" v-model="transferVisible" width="420px">
                <p style="margin:0 0 8px">{{ transferRow?.realName }}（{{ transferRow?.username }}）转到：</p>
                <el-select v-model="transferToClazzId" placeholder="选择目标班级" style="width:100%">
                    <el-option v-for="c in classList" :key="c.id" :label="c.name" :value="c.id"/>
                </el-select>
                <template #footer><el-button @click="transferVisible=false">取消</el-button><el-button type="primary" :disabled="!transferToClazzId" @click="doTransfer">确定转班</el-button></template>
            </el-dialog>
        </div>`,
    setup() {
        const classList = ref([]), selectedClazzId = ref(null), students = ref([])
        const addVisible = ref(false), addForm = reactive({username:'',realName:'',phone:'',email:''})
        const transferVisible = ref(false), transferRow = ref(null), transferToClazzId = ref(null)
        onMounted(async () => { try { const r = await api.classes({page:1,size:100}); classList.value = r.data.data.records } catch(e) { console.error(e) } })
        const loadStudents = async () => { if (!selectedClazzId.value) return; try { const r = await api.classStudents(selectedClazzId.value, {page:1,size:200}); students.value = r.data.data.records } catch(e) { console.error(e) } }
        const resetPwd = async id => { try { const r = await api.resetStudentPwd(id); $m('新密码：'+r.data.data?.newPassword) } catch(e) { console.error(e) } }
        const showAdd = () => { Object.assign(addForm, {username:'',realName:'',phone:'',email:''}); addVisible.value = true }
        const saveAdd = async () => {
            if (!addForm.username || !addForm.realName) return $m('学号和姓名必填','error')

        const form = reactive({id:null,type:'SINGLE_CHOICE',content:'',correctAnswer:'',referenceAnswer:'',difficulty:'MEDIUM',score:5,options:[],knowledgePointIds:[]})
        const load = async () => { try { const r = await api.questions({page:1,size:100,keyword:keyword.value,type:filterType.value,difficulty:filterDifficulty.value}); list.value = r.data.data.records } catch(e) { console.error(e) } }
        const toggle = async id => { try { await api.toggleQuestion(id); load() } catch(e) { console.error(e) } }
        const del = id => { $c('确定删除该题目？').then(async ()=>{ await api.deleteQuestion(id); load(); $m('已删除') }).catch(()=>{}) }
        const showAdd = () => { Object.assign(form, {id:null,type:'SINGLE_CHOICE',content:'',correctAnswer:'',referenceAnswer:'',difficulty:'MEDIUM',score:5,options:[],knowledgePointIds:[]}); isEdit.value = false; dialogVisible.value = true }
        const edit = async row => {
            Object.assign(form, {id:row.id,type:row.type,content:row.content,correctAnswer:row.correctAnswer||'',referenceAnswer:row.referenceAnswer||'',difficulty:row.difficulty,score:Number(row.score)||5,options:[],knowledgePointIds:[]})
            isEdit.value = true; dialogVisible.value = true
            try { const [or, kr] = await Promise.all([api.questionOptions(row.id), api.questionKps(row.id)]); form.options = or.data.data || []; form.knowledgePointIds = kr.data.data || [] } catch(e) { console.error(e) }
        }
        const save = async () => {
            const d = { content: form.content, correctAnswer: form.correctAnswer, referenceAnswer: form.referenceAnswer, difficulty: form.difficulty, score: form.score, knowledgePointIds: form.knowledgePointIds }
            if (form.type==='SINGLE_CHOICE'||form.type==='MULTI_CHOICE') d.options = form.options.filter(o => o.label && o.content)
            try {
                if (isEdit.value) {
                    await api.updateQuestion(form.id, d); dialogVisible.value = false; load(); $m('修改成功')
                } else {
                    d.type = form.type
                    // 录入查重：命中相似题则询问是否仍要保存（需求要求）
                    const dup = await api.checkDuplicate({content: form.content, type: form.type})
                    const dups = dup.data.data || []
                    const proceed = dups.length === 0 ? Promise.resolve()
                        : $c(`检测到 ${dups.length} 道相似题目（ID: ${dups.map(x=>x.id).join(', ')}），是否仍要保存？`, '题目查重提示')
                    proceed.then(async () => { await api.addQuestion(d); dialogVisible.value = false; load(); $m('新增成功') }).catch(()=>{})
                }
            } catch(e) { $m(e.response?.data?.msg||'失败','error') }
        }
        const uploadQuestions = file => {
            api.importQuestions(file).then(r => {
                const d = r.data.data
                load()
                if (d.duplicates?.length) {
                    $m(`成功导入 ${d.imported} 道，跳过重复 ${d.duplicates.length} 道${d.failed?`，失败 ${d.failed} 道`:''}`, 'warning')
                    const lines = d.duplicates.slice(0,5).map(x=>`第${x.row}行「${x.content}」→ 与题目#${x.matchId}重复`).join('\n')
                    ElementPlus.ElMessageBox.alert(`以下题目与题库重复，已自动跳过：\n${lines}${d.duplicates.length>5?`\n…共 ${d.duplicates.length} 道`:''}`, '导入查重结果')
                } else if (d.failed) {
                    $m(`成功导入 ${d.imported} 道，失败 ${d.failed} 道`, 'warning')
                    ElementPlus.ElMessageBox.alert(d.errors.slice(0,5).join('\n'), '导入失败明细')
                } else {
                    $m(`成功导入 ${d.imported} 道题目`)
                }
            }).catch(e => $m(e.response?.data?.msg||'导入失败','error'))
            return false
        }
        onMounted(async () => { load(); try { const r = await api.knowledgePoints(); kpList.value = r.data.data } catch(e) { console.error(e) } })
        return { list, keyword, filterType, filterDifficulty, TYPE_MAP, DIFF_MAP, dialogVisible, form, kpList, isEdit, load, toggle, del, showAdd, edit, save, uploadQuestions }
    }
})

})

// ======== 登录页 ========
const LoginView = defineComponent({
    template: `
        <div class="login-container">
            <div class="login-card">
                <h1>📚 在线作业系统</h1>
                <p style="text-align:center;color:#909399;margin-bottom:20px">欢迎登录</p>
                <el-form :model="form" :rules="rules" ref="formRef">
                    <el-form-item prop="username">
                        <el-input v-model="form.username" placeholder="用户名" size="large" clearable/>
                    </el-form-item>
                    <el-form-item prop="password">
                        <el-input v-model="form.password" placeholder="密码" type="password" size="large" show-password @keyup.enter="doLogin"/>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" size="large" style="width:100%" @click="doLogin" :loading="loading">登 录</el-button>
                    </el-form-item>
                </el-form>
                <div style="text-align:center;color:#909399;font-size:12px">
                    测试账号：admin / T2024001 / 20240001<br>密码统一：Admin123456
                </div>
            </div>
        </div>`,
    setup() {
        const router = useRouter()
        const form = reactive({username:'',password:''})
        const rules = {username:[{required:true,message:'请输入用户名'}],password:[{required:true,message:'请输入密码'}]}
        const formRef = ref(null), loading = ref(false)
        const doLogin = async () => {
            if (!formRef.value) return
            await formRef.value.validate(async valid => {
                if (!valid) return
                loading.value = true
                try {
                    const r = await api.login({username:form.username,password:form.password})
                    const t = r.data.data.token
                    localStorage.setItem('token', t)
                    let u
                    try {
                        const me = await axios.get('/api/auth/me')
                        u = {username:me.data.data.username, realName:me.data.data.realName, role:me.data.data.role}
                    } catch(e) {
                        u = {username:form.username, realName:form.username, role:r.data.data.role}
                    }
                    localStorage.setItem('userInfo', JSON.stringify(u))
                    router.push(defaultPath(u.role))
                } catch(e) { $m(e.response?.data?.msg || '登录失败','error') } finally { loading.value = false }
            })
        }
        return { form, rules, formRef, loading, doLogin }
    }
})

// ======== 主布局（含侧边栏，内容区 router-view）========
const MainLayout = defineComponent({
    template: `
        <div>
            <div class="main-header">
                <h2>📚 在线作业系统</h2>
                <div>
                    <span style="color:#606266;margin-right:16px">{{ userInfo.realName || userInfo.username }}
                        <el-tag size="small" :type="roleTag">{{ roleLabel }}</el-tag>
                    </span>
                    <el-button size="small" @click="openProfile">🧑‍💼 个人中心</el-button>
                    <el-button size="small" @click="logout">退出登录</el-button>
                </div>
            </div>
            <div class="main-layout">
                <div class="sidebar">
                    <el-menu :default-active="route.path" router text-color="#bfcbd9" active-text-color="#409eff">
                        <template v-if="role==='ADMIN'">
                            <el-menu-item index="/dashboard"><span>📊</span> 首页统计</el-menu-item>
                            <el-menu-item index="/teachers"><span>👤</span> 教师管理</el-menu-item>
                            <el-menu-item index="/classes"><span>🏫</span> 班级管理</el-menu-item>
                            <el-menu-item index="/students"><span>👨‍🎓</span> 学生管理</el-menu-item>
                            <el-menu-item index="/questions"><span>✏️</span> 题库管理</el-menu-item>
                            <el-menu-item index="/knowledge"><span>📂</span> 知识点管理</el-menu-item>
                            <el-menu-item index="/tcAdmin"><span>🏫</span> 教学班管理</el-menu-item>
                        </template>
                        <template v-if="role==='TEACHER'">
                            <el-menu-item index="/teachingClasses"><span>🏫</span> 教学班管理</el-menu-item>
                            <el-menu-item index="/myHomeworks"><span>📄</span> 作业管理</el-menu-item>
                            <el-menu-item index="/assignHw"><span>📝</span> 布置作业</el-menu-item>
                            <el-menu-item index="/grading"><span>✅</span> 批改作业</el-menu-item>
                        </template>
                        <template v-if="role==='STUDENT'">
                            <el-menu-item index="/myHw"><span>📓</span> 我的作业</el-menu-item>
                        </template>
                    </el-menu>
                </div>
                <div class="content">
                    <router-view @viewGrading="goGrading"></router-view>
                </div>
            </div>
        </div>
        <!-- 个人中心弹窗（三角色共用）-->
        <el-dialog title="🧑‍💼 个人中心" v-model="profileVisible" width="540px">
            <el-tabs v-model="profileTab">
                <el-tab-pane label="基本信息" name="info">
                    <el-form :model="profileForm" label-width="80px">
                        <el-form-item label="用户名"><el-input :model-value="userInfo.username" disabled/></el-form-item>
                        <el-form-item label="姓名"><el-input v-model="profileForm.realName" placeholder="真实姓名"/></el-form-item>
                        <el-form-item label="手机号"><el-input v-model="profileForm.phone" placeholder="选填"/></el-form-item>
                        <el-form-item label="邮箱"><el-input v-model="profileForm.email" placeholder="选填"/></el-form-item>
                        <el-form-item><el-button type="primary" @click="saveProfile">保存</el-button></el-form-item>
                    </el-form>
                </el-tab-pane>
                <el-tab-pane label="修改密码" name="pwd">
                    <el-form :model="pwdForm" label-width="90px">
                        <el-form-item label="原密码"><el-input v-model="pwdForm.oldPassword" type="password" show-password/></el-form-item>
                        <el-form-item label="新密码"><el-input v-model="pwdForm.newPassword" type="password" show-password placeholder="至少8位，含大小写字母和数字"/></el-form-item>
                        <el-form-item label="确认新密码"><el-input v-model="pwdForm.confirm" type="password" show-password/></el-form-item>
                        <el-form-item><el-button type="primary" @click="savePwd">修改密码</el-button></el-form-item>
                    </el-form>
                </el-tab-pane>
            </el-tabs>
        </el-dialog>
    </div>`,
    setup() {
        const router = useRouter()
        const route = useRoute()
        const userInfo = reactive(JSON.parse(localStorage.getItem('userInfo')||'{}'))
        const role = computed(() => userInfo.role || '')
        const roleTag = computed(() => ({ADMIN:'danger',TEACHER:'warning',STUDENT:'success'}[role.value]||''))
        const roleLabel = computed(() => ({ADMIN:'管理员',TEACHER:'教师',STUDENT:'学生'}[role.value]||''))
        const logout = () => { localStorage.clear(); router.push('/login') }
        const goGrading = () => { router.push('/grading') }
        // 个人中心
        const profileVisible = ref(false), profileTab = ref('info')
        const profileForm = reactive({realName:'', phone:'', email:''})
        const pwdForm = reactive({oldPassword:'', newPassword:'', confirm:''})
        const openProfile = async () => {
            profileVisible.value = true; profileTab.value = 'info'
            Object.assign(profileForm, {realName: userInfo.realName||'', phone:'', email:''})
            try { const r = await api.profile(); const d = r.data.data; Object.assign(profileForm, {realName:d.realName||'', phone:d.phone||'', email:d.email||''}) } catch(e) { console.error(e) }
            Object.assign(pwdForm, {oldPassword:'', newPassword:'', confirm:''})
        }
        const saveProfile = async () => {
            if (!profileForm.realName) return $m('姓名不能为空','error')
            try {
                await api.updateProfile(profileForm)
                userInfo.realName = profileForm.realName
                localStorage.setItem('userInfo', JSON.stringify(userInfo))
                $m('个人信息已更新')
            } catch(e) { $m(e.response?.data?.msg||'保存失败','error') }
        }
        const savePwd = async () => {
            if (pwdForm.newPassword !== pwdForm.confirm) return $m('两次输入的新密码不一致','error')
            try { await api.changePassword({oldPassword: pwdForm.oldPassword, newPassword: pwdForm.newPassword}); Object.assign(pwdForm,{oldPassword:'',newPassword:'',confirm:''}); $m('密码修改成功') } catch(e) { $m(e.response?.data?.msg||'修改失败','error') }
        }
        return { userInfo, role, roleTag, roleLabel, route, logout, goGrading, profileVisible, profileTab, profileForm, pwdForm, openProfile, saveProfile, savePwd }
    }
})

// ======== 路由 ========
const defaultPath = role => ({ADMIN:'/dashboard',TEACHER:'/myHomeworks',STUDENT:'/myHw'}[role] || '/login')

const routes = [
    { path: '/login', component: LoginView },
    {
        path: '/',
        component: MainLayout,
        redirect: () => defaultPath((JSON.parse(localStorage.getItem('userInfo')||'{}')).role),
        children: [
            { path: 'dashboard', component: AdminDashboard, meta: {roles:['ADMIN']} },
            { path: 'teachers', component: AdminTeachers, meta: {roles:['ADMIN']} },
            { path: 'classes', component: AdminClasses, meta: {roles:['ADMIN']} },
            { path: 'students', component: AdminStudents, meta: {roles:['ADMIN']} },
            { path: 'questions', component: AdminQuestions, meta: {roles:['ADMIN']} },
            { path: 'knowledge', component: AdminKnowledge, meta: {roles:['ADMIN']} },
            { path: 'tcAdmin', component: AdminTeachingClasses, meta: {roles:['ADMIN']} },
            { path: 'teachingClasses', component: TeacherTeachingClasses, meta: {roles:['TEACHER']} },
            { path: 'myHomeworks', component: TeacherHomeworks, meta: {roles:['TEACHER']} },
            { path: 'assignHw', component: TeacherAssign, meta: {roles:['TEACHER']} },
            { path: 'grading', component: TeacherGrading, meta: {roles:['TEACHER']} },
            { path: 'myHw', component: StudentHomeworks, meta: {roles:['STUDENT']} },
        ]
    },
    { path: '/:pathMatch(.*)*', redirect: '/' }
]

const router = createRouter({
    history: createWebHistory(),
    routes
})

// 登录守卫：未登录 → /login；已登录访问 /login → 默认页；角色不匹配 → 默认页
router.beforeEach(to => {
    const token = localStorage.getItem('token')
    const role = (JSON.parse(localStorage.getItem('userInfo')||'{}')).role
    if (to.path === '/login') {
        return token ? defaultPath(role) : true
    }
    if (!token) return '/login'
    if (to.meta.roles && !to.meta.roles.includes(role)) return defaultPath(role)
    return true
})

const app = createApp({})
app.use(ElementPlus)
app.use(router)
app.mount('#app')
</script>
