<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线作业系统</title>
    <!-- 本地 vendor（CDN 离线化：不依赖 unpkg 外网，国内网络/服务器部署均可用） -->
    <link rel="stylesheet" href="/vendor/element-plus/index.css">
    <!-- 富文本题干：wangeditor（编辑器）+ katex（公式）+ highlight.js（代码块）+ echarts（图表）+ dompurify（XSS 过滤） -->
    <link rel="stylesheet" href="/vendor/wangeditor.css">
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/vendor/hljs/github.min.css">
    <script src="/vendor/vue.global.prod.js"></script>
    <script src="/vendor/vue-router.global.js"></script>
    <script src="/vendor/element-plus/index.full.min.js"></script>
    <script src="/vendor/axios.min.js"></script>
    <script src="/vendor/wangeditor.js"></script>
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/hljs/highlight.min.js"></script>
    <script src="/vendor/echarts.min.js"></script>
    <script src="/vendor/dompurify.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa}
        .login-container{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
        .login-card{width:420px;padding:40px;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .login-card h1{text-align:center;margin-bottom:30px;color:#303133;font-size:24px}
        .main-header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .main-header h2{font-size:18px;color:#303133}
        .main-layout{display:flex;min-height:calc(100vh - 56px)}
        .sidebar{width:220px;background:#304156;color:#fff;padding:12px 0}
        .sidebar .el-menu{background:transparent;border:none}
        .sidebar .el-menu-item{color:#bfcbd9}
        .sidebar .el-menu-item:hover,.sidebar .el-menu-item.is-active{background:#263445;color:#409eff}
        .content{padding:20px;flex:1;overflow-y:auto}
        .stat-cards{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
        .stat-card{flex:1;min-width:160px;padding:20px;background:#fff;border-radius:8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .2s}
        .stat-card:hover{transform:translateY(-2px)}
        .stat-card .num{font-size:32px;font-weight:700;color:#409eff}
        .stat-card .label{font-size:13px;color:#909399;margin-top:4px}
        .section-card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
        .section-card h3{margin-bottom:16px;font-size:16px;color:#303133;border-bottom:2px solid #409eff;padding-bottom:8px}
        /* 作答选项：横向流式排列（短选项并排不占整行），与题干左对齐 */
        .opt-group{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;margin:4px 0 0 0}
        .opt-group .el-radio,.opt-group .el-checkbox{margin-right:0;height:auto;white-space:normal}
        [v-cloak]{display:none}
    </style>
</head>
<body>
<div id="app" v-cloak>
    <router-view></router-view>
</div>

<script>
const { createApp, ref, reactive, computed, watch, defineComponent, onMounted, nextTick, toRefs } = Vue
const { createRouter, createWebHistory, useRouter, useRoute } = VueRouter

// ======== Axios 配置 ========
axios.defaults.baseURL = ''
axios.interceptors.request.use(c => {
    const t = localStorage.getItem('token')
    if (t) c.headers.Authorization = 'Bearer ' + t
    return c
})
axios.interceptors.response.use(r => r, err => {
    if (err.response?.status === 401) { localStorage.clear(); location.reload() }
    return Promise.reject(err)
})

const $m = (msg, type='success') => ElementPlus.ElMessage[type](msg)
const $c = (msg, title='提示') => ElementPlus.ElMessageBox.confirm(msg, title, {type:'warning'})
const TYPE_MAP = {SINGLE_CHOICE:'单选题',MULTI_CHOICE:'多选题',TRUE_FALSE:'判断题',ESSAY:'问答题',APPLICATION:'应用题'}
const DIFF_MAP = {EASY:{label:'简单',type:'success'},MEDIUM:{label:'中等',type:'warning'},HARD:{label:'困难',type:'danger'}}

// ======== 题型分类（与后端 Question.OBJECTIVE_TYPES/SUBJECTIVE_TYPES 一致）========
const OBJ_TYPES = ['SINGLE_CHOICE','MULTI_CHOICE','TRUE_FALSE']
const SUBJ_TYPES = ['ESSAY','APPLICATION']
const isObjective = t => OBJ_TYPES.includes(t)
const isSubjective = t => SUBJ_TYPES.includes(t)

// ======== 富文本题干工具（应用题：图片/图表/公式/代码块）========
// 富文本 HTML → 纯文本（列表截断显示用，避免显示标签源码）
const stripHtml = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').trim() }
// DOMPurify 清洗（学生端 v-html 渲染题干，防 XSS 注入；保留 data-chart 图表配置属性）
const safeHtml = html => DOMPurify.sanitize(html || '', { ADD_ATTR: ['data-chart'] })
// 渲染题干富文本容器：清洗注入 + 扫描图表(ECharts)/代码块(hljs)，幂等（重复调用先 dispose）
const renderRich = el => {
    if (!el) return
    el.querySelectorAll('.q-chart').forEach(c => {
        try {
            const opt = JSON.parse(c.getAttribute('data-chart') || '{}')
            if (opt && opt.series) {
                const exist = echarts.getInstanceByDom(c)
                if (exist) exist.dispose()
                echarts.init(c).setOption(opt)
            }
        } catch(e) { console.error('图表渲染失败:', e) }
    })
    el.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b) } catch(e){} })
}

const api = {
    login: d => axios.post('/api/auth/login', d),
    sendVerificationCode: d => axios.post('/api/auth/verification-code/send', d),
    register: d => axios.post('/api/auth/register', d),
    profile: () => axios.get('/api/auth/me'),
    updateProfile: d => axios.put('/api/auth/profile', d),
    changePassword: d => axios.put('/api/auth/password', d),
    dashboard: () => axios.get('/api/admin/dashboard'),
    allStudents: p => axios.get('/api/admin/students', {params: p}),
    // Admin - Teachers
    teachers: p => axios.get('/api/admin/teachers', {params: p}),
    addTeacher: d => axios.post('/api/admin/teachers', d),
    updateTeacher: (id, d) => axios.put('/api/admin/teachers/' + id, d),
    deleteTeacher: id => axios.delete('/api/admin/teachers/' + id),
    resetTeacherPwd: id => axios.put('/api/admin/teachers/' + id + '/reset-pwd'),
    // Admin - Classes
    classes: p => axios.get('/api/admin/classes', {params: p}),
    addClass: d => axios.post('/api/admin/classes', d),
    updateClass: (id, d) => axios.put('/api/admin/classes/' + id, d),
    deleteClass: id => axios.delete('/api/admin/classes/' + id),
    classStudents: (id, p) => axios.get('/api/admin/classes/' + id + '/students', {params: p}),
    transferStudent: (cid, sid, d) => axios.put(`/api/admin/classes/${cid}/students/${sid}/transfer`, d),
    importStudents: (file, clazzId) => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/students/import?clazzId=' + clazzId, fd) },
    addStudent: d => axios.post('/api/admin/students', d),
    deleteStudent: id => axios.delete('/api/admin/students/' + id),
    // Admin - Questions
    questions: p => axios.get('/api/admin/questions', {params: p}),
    addQuestion: d => axios.post('/api/admin/questions', d),
    updateQuestion: (id, d) => axios.put('/api/admin/questions/' + id, d),
    deleteQuestion: id => axios.delete('/api/admin/questions/' + id),
    questionOptions: id => axios.get('/api/admin/questions/' + id + '/options'),
    questionKps: id => axios.get('/api/admin/questions/' + id + '/knowledge-points'),
    checkDuplicate: d => axios.post('/api/admin/questions/check-duplicate', d),
    toggleQuestion: id => axios.put('/api/admin/questions/' + id + '/status'),
    importQuestions: file => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/questions/import', fd) },
    aiGenerate: d => axios.post('/api/admin/questions/ai-generate', d),
    aiGenerateFile: (file, p) => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/questions/ai-generate/file', fd, {params: p}) },
    // AI 出题资源文件管理
    materials: () => axios.get('/api/admin/materials'),
    uploadMaterial: file => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/materials', fd) },
    deleteMaterial: id => axios.delete('/api/admin/materials/' + id),
    // 题干图片（应用题富文本插图）
    questionImages: () => axios.get('/api/admin/question-images'),
    uploadQuestionImage: file => { const fd = new FormData(); fd.append('file', file); return axios.post('/api/admin/question-images', fd) },
    deleteQuestionImage: id => axios.delete('/api/admin/question-images/' + id),
    // Admin - Knowledge Points
    knowledgePoints: k => axios.get('/api/admin/knowledge-points', {params: {keyword: k || ''}}),
    addKnowledgePoint: d => axios.post('/api/admin/knowledge-points', d),
    updateKnowledgePoint: (id, d) => axios.put('/api/admin/knowledge-points/' + id, d),
    deleteKnowledgePoint: id => axios.delete('/api/admin/knowledge-points/' + id),
    // Admin - Teaching Classes
    adminTeachingClasses: p => axios.get('/api/admin/teaching-classes', {params: p}),
    addAdminTeachingClass: d => axios.post('/api/admin/teaching-classes', d),
    updateAdminTeachingClass: (id, d) => axios.put('/api/admin/teaching-classes/' + id, d),
    deleteAdminTeachingClass: id => axios.delete('/api/admin/teaching-classes/' + id),
    adminTeachingClassDetail: id => axios.get('/api/admin/teaching-classes/' + id),
    // Admin - Students
    resetStudentPwd: id => axios.put('/api/admin/students/' + id + '/reset-pwd'),
    // Teacher
    teacherClasses: p => axios.get('/api/teacher/classes', {params: p}),
    teacherTeachingClasses: p => axios.get('/api/teacher/teaching-classes', {params: p}),
    addTeachingClass: d => axios.post('/api/teacher/teaching-classes', d),
    updateTeachingClass: (id, d) => axios.put('/api/teacher/teaching-classes/' + id, d),
    deleteTeachingClass: id => axios.delete('/api/teacher/teaching-classes/' + id),
    teachingClassDetail: id => axios.get('/api/teacher/teaching-classes/' + id),
    teachingClassAddClasses: (id, d) => axios.post(`/api/teacher/teaching-classes/${id}/classes`, d),
    teachingClassRemoveClass: (id, cid) => axios.delete(`/api/teacher/teaching-classes/${id}/classes/${cid}`),
    teachingClassResetStudentPwd: (id, sid) => axios.put(`/api/teacher/teaching-classes/${id}/students/${sid}/reset-pwd`),
    teachingClassStudents: id => axios.get('/api/teacher/teaching-classes/' + id + '/students'),
    resetTcStudentPwds: id => axios.put('/api/teacher/teaching-classes/' + id + '/reset-student-pwds'),
    teacherHomeworks: p => axios.get('/api/teacher/homeworks', {params: p}),
    assignHomework: d => axios.post('/api/teacher/homeworks', d),
    deleteHomework: id => axios.delete('/api/teacher/homeworks/' + id),
    homeworkDetail: id => axios.get('/api/teacher/homeworks/' + id + '/detail'),
    homeworkSubmissions: id => axios.get('/api/teacher/homeworks/' + id + '/submissions'),
    gradingList: (id, p) => axios.get('/api/teacher/homeworks/' + id + '/grading', {params: p}),
    submissionAnswers: (hwId, subId) => axios.get(`/api/teacher/homeworks/${hwId}/submissions/${subId}/answers`),
    searchQuestions: p => axios.get('/api/teacher/questions/search', {params: p}),
    gradeAnswer: (hwId, ansId, d) => axios.put(`/api/teacher/homeworks/${hwId}/grading/${ansId}`, d),
    exportGrades: id => axios.get('/api/teacher/homeworks/' + id + '/export', {responseType: 'blob'}),
    // Student
    studentHomeworks: p => axios.get('/api/student/homeworks', {params: p}),
    studentHomeworkDetail: id => axios.get('/api/student/homeworks/' + id),
    submitHomework: (id, d) => axios.post('/api/student/homeworks/' + id + '/submit', d),
    homeworkResult: id => axios.get('/api/student/homeworks/' + id + '/result'),
}

// ======== Admin Dashboard ========
const AdminDashboard = defineComponent({
    template: `
        <div>
            <div class="stat-cards">
                <div class="stat-card" v-for="s in stats" :key="s.label">
                    <div class="num">{{ s.value }}</div><div class="label">{{ s.label }}</div>
                </div>
            </div>
            <div class="section-card"><h3>系统总览</h3>
                <p style="color:#909399">当前系统运行正常。请使用左侧菜单进行管理操作。</p>
            </div>
        </div>`,
    setup() {
        const stats = ref([{label:'班级数',value:0},{label:'学生数',value:0},{label:'教师数',value:0},{label:'题库数',value:0},{label:'作业数',value:0},{label:'知识点数',value:0}])
        const keys = ['classCount','studentCount','teacherCount','questionCount','homeworkCount','knowledgePointCount']
        onMounted(async () => {
            try { const r = await api.dashboard(); const d = r.data.data; stats.value.forEach((s,i) => s.value = d[keys[i]] || 0) } catch(e) { console.error('Dashboard load failed', e) }
        })
        return { stats }
    }
})

// ======== Admin Teachers ========
const AdminTeachers = defineComponent({
    template: `
        <div class="section-card"><h3>教师管理 <el-button type="primary" size="small" @click="showAdd">新增教师</el-button></h3>
            <el-input v-model="keyword" placeholder="搜索姓名/工号" size="small" style="width:240px;margin-right:8px" clearable @clear="load"/>
            <el-button size="small" @click="load">搜索</el-button>
            <el-table :data="list" style="margin-top:12px" border stripe>
                <el-table-column prop="id" label="ID" width="60"/>
                <el-table-column prop="username" label="工号" width="120"/>
                <el-table-column prop="realName" label="姓名" width="100"/>
                <el-table-column prop="phone" label="手机号" width="140"/>
                <el-table-column prop="email" label="邮箱"/>
                <el-table-column prop="status" label="状态" width="80">
                    <template #default="{row}"><el-tag :type="row.status==='ACTIVE'?'success':'danger'" size="small">{{row.status}}</el-tag></template>
                </el-table-column>
                <el-table-column label="操作" width="240">
                    <template #default="{row}">
                        <el-button size="small" @click="edit(row)">编辑</el-button>
                        <el-button size="small" type="warning" @click="resetPwd(row.id)">重置密码</el-button>
                        <el-button size="small" type="danger" @click="del(row.id)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-dialog :title="dialogTitle" v-model="dialogVisible" width="460px">
                <el-form :model="form" label-width="80px">
                    <el-form-item label="工号"><el-input v-model="form.username"/></el-form-item>
                    <el-form-item label="姓名"><el-input v-model="form.realName"/></el-form-item>
                    <el-form-item label="手机号"><el-input v-model="form.phone"/></el-form-item>
                    <el-form-item label="邮箱"><el-input v-model="form.email"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="dialogVisible=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
            </el-dialog>
        </div>`,
    setup() {
        const list = ref([]), keyword = ref(''), dialogVisible = ref(false), isEdit = ref(false), form = reactive({username:'',realName:'',phone:'',email:''})
        const dialogTitle = computed(() => isEdit.value?'编辑教师':'新增教师')
        const load = async () => { try { const r = await api.teachers({page:1,size:100,keyword:keyword.value}); list.value = r.data.data.records } catch(e) { console.error(e) } }
        const showAdd = () => { Object.assign(form, {username:'',realName:'',phone:'',email:''}); isEdit.value = false; dialogVisible.value = true }
        const edit = row => { Object.assign(form, row); isEdit.value = true; dialogVisible.value = true }
        const save = async () => { try { isEdit.value ? await api.updateTeacher(form.id, form) : await api.addTeacher(form); dialogVisible.value = false; load(); $m(isEdit.value?'修改成功':'新增成功，初始密码 Admin123456，首次登录需修改') } catch(e) { $m(e.response?.data?.msg||'操作失败','error') } }
        const del = id => { $c('确定删除该教师？').then(async ()=>{ await api.deleteTeacher(id); load(); $m('已删除') }).catch(()=>{}) }
        const resetPwd = async id => { try { const r = await api.resetTeacherPwd(id); $m('新密码：'+r.data.data?.newPassword) } catch(e) { console.error(e) } }
        onMounted(load)
        return { list, keyword, dialogVisible, dialogTitle, form, showAdd, edit, save, del, resetPwd, load }
    }
})

// ======== Admin Classes ========
const AdminClasses = defineComponent({
    template: `
        <div class="section-card"><h3>班级管理 <el-button type="primary" size="small" @click="showAdd">新增班级</el-button></h3>
            <el-table :data="list" border stripe>
                <el-table-column prop="id" label="ID" width="60"/>
                <el-table-column prop="name" label="班级名称"/>
                <el-table-column prop="grade" label="年级" width="100"/>
                <el-table-column prop="major" label="专业" width="150"/>
                <el-table-column label="操作" width="280">
                    <template #default="{row}">
                        <el-button size="small" @click="viewStudents(row)">查看学生</el-button>
                        <el-button size="small" @click="edit(row)">编辑</el-button>
                        <el-button size="small" type="danger" @click="del(row.id)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-dialog title="新增班级" v-model="dialogVisible" width="460px">
                <el-form :model="form" label-width="80px">
                    <el-form-item label="班级名称"><el-input v-model="form.name" placeholder="如: 2024级软件工程1班"/></el-form-item>
                    <el-form-item label="年级"><el-input v-model="form.grade" placeholder="如: 2024级"/></el-form-item>
                    <el-form-item label="专业"><el-input v-model="form.major" placeholder="如: 软件工程"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="dialogVisible=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
            </el-dialog>
            <el-dialog title="编辑班级" v-model="editVisible" width="460px">
                <el-form :model="editForm" label-width="80px">
                    <el-form-item label="班级名称"><el-input v-model="editForm.name"/></el-form-item>
                    <el-form-item label="年级"><el-input v-model="editForm.grade"/></el-form-item>
                    <el-form-item label="专业"><el-input v-model="editForm.major"/></el-form-item>
                </el-form>
                <template #footer><el-button @click="editVisible=false">取消</el-button><el-button type="primary" @click="saveEdit">保存</el-button></template>
            </el-dialog>
            <el-dialog title="班级学生" v-model="studentVisible" width="700px">
                <div style="margin-bottom:8px"><el-upload :show-file-list="false" :before-upload="f=>uploadStudents(f)" accept=".xlsx"><el-button size="small" type="success">导入学生Excel</el-button></el-upload></div>
                <el-table :data="students" border stripe max-height="400">
                    <el-table-column prop="username" label="学号" width="120"/>
                    <el-table-column prop="realName" label="姓名" width="100"/>
                    <el-table-column prop="phone" label="手机号" width="140"/>
                    <el-table-column prop="email" label="邮箱"/>
                </el-table>
            </el-dialog>
        </div>`,
    setup() {
        const list = ref([]), dialogVisible = ref(false), editVisible = ref(false), studentVisible = ref(false)
        const form = reactive({name:'',grade:'',major:''}), editForm = reactive({id:null,name:'',grade:'',major:''})
        const students = ref([]), currentClazzId = ref(null)
        const load = async () => { try { const r = await api.classes({page:1,size:100}); list.value = r.data.data.records } catch(e) { console.error(e) } }
        const showAdd = () => { Object.assign(form, {name:'',grade:'',major:''}); dialogVisible.value = true }
        const save = async () => { try { await api.addClass(form); dialogVisible.value = false; load(); $m('新增成功') } catch(e) { $m(e.response?.data?.msg||'失败','error') } }
        const edit = row => { Object.assign(editForm, row); editVisible.value = true }
        const saveEdit = async () => { try { await api.updateClass(editForm.id, editForm); editVisible.value = false; load(); $m('修改成功') } catch(e) { $m(e.response?.data?.msg||'失败','error') } }
        const del = id => { $c('确定删除该班级？').then(async ()=>{ await api.deleteClass(id); load(); $m('已删除') }).catch(()=>{}) }
        const viewStudents = async row => { currentClazzId.value = row.id; studentVisible.value = true; try { const r = await api.classStudents(row.id, {page:1,size:200}); students.value = r.data.data.records } catch(e) { console.error(e) } }
        const uploadStudents = file => {
            api.importStudents(file, currentClazzId.value).then(r => {
                const d = r.data.data
                if (d.errors && d.errors.length) {
                    const lines = d.errors.slice(0, 10).map(e => `第${e.row}行：${e.msg}`).join('\n')
                    ElementPlus.ElMessageBox.alert(`导入校验未通过（共 ${d.errors.length} 条错误），未导入任何学生：\n\n${lines}${d.errors.length > 10 ? `\n…其余 ${d.errors.length - 10} 条略` : ''}`, '导入排错', { type: 'error' })
                } else {
                    $m(`成功导入 ${d.imported} 名学生（初始密码 Admin123456，首次登录需修改）`)
                    viewStudents({id: currentClazzId.value})
                }
            }).catch(e => $m(e.response?.data?.msg || '导入失败', 'error'))
            return false
        }
        onMounted(load)
        return { list, dialogVisible, editVisible, studentVisible, form, editForm, students, showAdd, save, edit, saveEdit, del, viewStudents, uploadStudents }
    }
})

// ======== Admin Students ========
const AdminStudents = defineComponent({
    template: `
        <div class="section-card"><h3>学生管理

            const rows = chartForm.dataText.split('\n').map(l => l.trim()).filter(Boolean)
                .map(l => { const p = l.split(/[,，]/); return { name: (p[0]||'').trim(), value: Number(p[1]) } })
                .filter(r => r.name && !isNaN(r.value))
            const t = chartForm.title || ''
            if (chartForm.type === 'pie') {
                return { title: t ? {text:t, left:'center'} : undefined, tooltip:{trigger:'item'},
                    series:[{ type:'pie', radius:'60%', data: rows, label:{formatter:'{b}: {c}'} }] }
            }
            return { title: t ? {text:t, left:'center'} : undefined, tooltip:{trigger:'axis'},
                xAxis:{type:'category', data: rows.map(r=>r.name)}, yAxis:{type:'value'},
                series:[{ type: chartForm.type==='bar' ? 'bar' : 'line', data: rows.map(r=>r.value), smooth: true }] }
        }
        const renderChartPreview = () => {
            if (!chartPreview.value) return
            try {
                const opt = buildChartOption()
                if (!opt.series || !opt.series[0].data || !opt.series[0].data.length) return
                if (chartPreviewIns) { chartPreviewIns.dispose(); chartPreviewIns = null }
                chartPreviewIns = echarts.init(chartPreview.value)
                chartPreviewIns.setOption(opt)
            } catch(e) { console.error('图表预览失败:', e) }
        }
        watch(chartForm, () => renderChartPreview(), { deep: true })
        const openChartDialog = () => { chartVisible.value = true; nextTick(() => setTimeout(renderChartPreview, 100)) }
        const insertChart = () => {
            const opt = buildChartOption()
            if (!opt.series || !opt.series[0].data || !opt.series[0].data.length) { $m('请填写至少一行数据（名称,数值）', 'error'); return }
            if (!editor) return
            const json = JSON.stringify(opt).replace(/&/g, '&amp;').replace(/'/g, '&#39;')
            editor.dangerouslyInsertHtml(`<div class="q-chart" style="width:100%;height:300px" data-chart='${json}'>图表加载中...</div>`)
            chartVisible.value = false
        }
        // ========== 新增/编辑 ==========
        const showAdd = () => {
            Object.assign(form, {id:null,type:'SINGLE_CHOICE',content:'',correctAnswer:'',referenceAnswer:'',difficulty:'MEDIUM',score:5,options:[],knowledgePointIds:[]})
            isEdit.value = false; dialogVisible.value = true
            nextTick(() => setTimeout(initEditor, 150))  // 等 dialog 渲染完成（含动画）
        }
        const edit = async row => {
            Object.assign(form, {id:row.id,type:row.type,content:row.content,correctAnswer:row.correctAnswer||'',referenceAnswer:row.referenceAnswer||'',difficulty:row.difficulty,score:Number(row.score)||5,options:[],knowledgePointIds:[]})
            isEdit.value = true; dialogVisible.value = true
            try { const [or, kr] = await Promise.all([api.questionOptions(row.id), api.questionKps(row.id)]); form.options = or.data.data || []; form.knowledgePointIds = kr.data.data || [] } catch(e) { console.error(e) }
            nextTick(() => setTimeout(initEditor, 150))
        }
        const save = async () => {
            if (editor) form.content = editor.getHtml()  // 同步富文本编辑器内容
            const d = { content: form.content, correctAnswer: form.correctAnswer, referenceAnswer: form.referenceAnswer, difficulty: form.difficulty, score: form.score, knowledgePointIds: form.knowledgePointIds }
            if (form.type==='SINGLE_CHOICE'||form.type==='MULTI_CHOICE') d.options = form.options.filter(o => o.label && o.content)
            try {
                if (isEdit.value) {
                    await api.updateQuestion(form.id, d); dialogVisible.value = false; load(); $m('修改成功')
                } else {
                    d.type = form.type
                    // 录入查重：命中相似题则询问是否仍要保存（需求要求）；用纯文本查重，避免富文本 HTML 标签干扰 Jaccard
                    const dup = await api.checkDuplicate({content: stripHtml(form.content), type: form.type})
                    const dups = dup.data.data || []
                    const proceed = dups.length === 0 ? Promise.resolve()
                        : $c(`检测到 ${dups.length} 道相似题目（ID: ${dups.map(x=>x.id).join(', ')}），是否仍要保存？`, '题目查重提示')
                    proceed.then(async () => { await api.addQuestion(d); dialogVisible.value = false; load(); $m('新增成功') }).catch(()=>{})
                }
            } catch(e) { $m(e.response?.data?.msg||'失败','error') }
        }
        const uploadQuestions = file => {
            api.importQuestions(file).then(r => {
                const d = r.data.data
                load()
                if (d.duplicates?.length) {
                    $m(`成功导入 ${d.imported} 道，跳过重复 ${d.duplicates.length} 道${d.failed?`，失败 ${d.failed} 道`:''}`, 'warning')
                    const lines = d.duplicates.slice(0,5).map(x=>`第${x.row}行「${x.content}」→ 与题目#${x.matchId}重复`).join('\n')
                    ElementPlus.ElMessageBox.alert(`以下题目与题库重复，已自动跳过：\n${lines}${d.duplicates.length>5?`\n…共 ${d.duplicates.length} 道`:''}`, '导入查重结果')
                } else if (d.failed) {
                    $m(`成功导入 ${d.imported} 道，失败 ${d.failed} 道`, 'warning')
                    ElementPlus.ElMessageBox.alert(d.errors.slice(0,5).join('\n'), '导入失败明细')
                } else {
                    $m(`成功导入 ${d.imported} 道题目`)
                }
            }).catch(e => $m(e.response?.data?.msg||'导入失败','error'))
            return false
        }
        // ========== AI 出题 ==========
        const aiVisible = ref(false), aiType = ref('ESSAY'), aiCount = ref(5), aiDifficulty = ref('MEDIUM')
        const aiMaterial = ref(''), aiDrafts = ref([]), aiLoading = ref(false), aiImporting = ref(false)
        const aiChecked = ref([]), aiCheckAll = ref(false)
        const materials = ref([]), aiMaterialId = ref(null)
        const aiEditVisible = ref(false), aiEditForm = reactive({type:'ESSAY',content:'',correctAnswer:'',referenceAnswer:'',options:[],knowledgePoint:'',difficulty:'MEDIUM'})
        const loadMaterials = async () => { try { const r = await api.materials(); materials.value = r.data.data || [] } catch(e) { console.error(e) } }
        const openAi = () => { aiVisible.value = true; loadMaterials(); if (!aiDrafts.value.length) aiMaterial.value = '' }
        // 上传资源：成功提示 + 刷新列表（不自动触发生成）
        const materialUpload = file => {
            api.uploadMaterial(file).then(r => {
                if (r.data.code !== 200) { $m(r.data.msg || '上传失败', 'error'); return }
                $m(`上传成功：${r.data.data.fileName}`)
                loadMaterials()
            }).catch(e => $m(e.response?.data?.msg || '上传失败', 'error'))
            return false
        }
        const materialDelete = row => {
            $c(`确定删除资源「${row.fileName}」？`).then(async () => {
                try { await api.deleteMaterial(row.id); loadMaterials(); $m('已删除') } catch(e) { $m(e.response?.data?.msg || '删除失败', 'error') }
            }).catch(() => {})
        }
        const aiRun = async () => {
            const hasMaterial = aiMaterialId.value != null
            if (!hasMaterial && (!aiMaterial.value || !aiMaterial.value.trim())) return $m('请先选择资源文件或粘贴课程材料', 'error')
            aiLoading.value = true
            try {
                const payload = { type: aiType.value, count: aiCount.value, difficulty: aiDifficulty.value }
                if (hasMaterial) payload.materialId = aiMaterialId.value
                else payload.material = aiMaterial.value
                const r = await api.aiGenerate(payload)
                if (r.data.code !== 200) { $m(r.data.msg || 'AI 生成失败', 'error'); return }
                aiDrafts.value = r.data.data || []
                aiChecked.value = aiDrafts.value.map(() => true)
                aiCheckAll.value = true
                if (!aiDrafts.value.length) $m('AI 未生成题目，请调整材料或重试', 'warning')
            } catch(e) { $m(e.response?.data?.msg || 'AI 生成失败', 'error') } finally { aiLoading.value = false }
        }
        const aiEdit = (row, idx) => {
            Object.assign(aiEditForm, {
                type: row.type || 'ESSAY', content: row.content || '',
                correctAnswer: row.correctAnswer || '', referenceAnswer: row.referenceAnswer || '',
                options: (row.options || []).map(o => ({...o})), knowledgePoint: row.knowledgePoint || '',
                difficulty: row.difficulty || 'MEDIUM'
            })
            aiEditForm._idx = idx
            aiEditVisible.value = true
        }
        // 编辑弹窗关闭时写回草稿
        watch(aiEditVisible, v => { if (!v && aiEditForm._idx != null) {
            const i = aiEditForm._idx; const d = aiDrafts.value[i]
            if (d) Object.assign(d, {type: aiEditForm.type, content: aiEditForm.content, correctAnswer: aiEditForm.correctAnswer, referenceAnswer: aiEditForm.referenceAnswer, options: aiEditForm.options.map(o=>({...o})), knowledgePoint: aiEditForm.knowledgePoint, difficulty: aiEditForm.difficulty})
        }})
        const aiImport = async () => {
            const selected = aiDrafts.value.filter((d, i) => aiChecked.value[i])
            if (!selected.length) return $m('请先勾选要导入的题目','error')
            aiImporting.value = true
            let ok = 0, skip = 0; const errs = []
            for (const d of selected) {
                try {
                    const payload = { type: d.type, content: d.content, correctAnswer: d.correctAnswer, referenceAnswer: d.referenceAnswer, difficulty: d.difficulty, score: 5, knowledgePointIds: [] }
                    if (d.type==='SINGLE_CHOICE'||d.type==='MULTI_CHOICE') payload.options = (d.options||[]).filter(o=>o.label&&o.content)
                    if (d.knowledgePoint) { const kp = kpList.value.find(k=>k.name===d.knowledgePoint); if (kp) payload.knowledgePointIds = [kp.id] }
                    const dup = await api.checkDuplicate({content: d.content, type: d.type})
                    if (dup.data.code !== 200) { errs.push(`「${String(d.content).slice(0,18)}…」${dup.data.msg||'查重失败'}`); continue }
                    if ((dup.data.data||[]).length) { skip++; errs.push(`「${String(d.content).slice(0,18)}…」与题库重复，跳过`); continue }
                    const rq = await api.addQuestion(payload)
                    if (rq.data.code !== 200) { errs.push(`「${String(d.content).slice(0,18)}…」${rq.data.msg||'入库失败'}`); continue }
                    ok++
                } catch(e) { errs.push(`「${String(d.content).slice(0,18)}…」${e.response?.data?.msg||'失败'}`) }
            }
            aiImporting.value = false
            load()
            const msg = `导入完成：成功 ${ok} 道，跳过重复 ${skip} 道，失败 ${errs.length} 道`
            if (errs.length) ElementPlus.ElMessageBox.alert(msg + '\n' + errs.slice(0,5).join('\n'), 'AI 导入结果')
            else $m(msg)
        }
        onMounted(async () => { load(); try { const r = await api.knowledgePoints(); kpList.value = r.data.data } catch(e) { console.error(e) } })
        return { list, keyword, filterType, filterDifficulty, TYPE_MAP, DIFF_MAP, dialogVisible, form, kpList, isEdit, load, toggle, del, showAdd, edit, save, uploadQuestions,
            editorBox, toolbarBox, destroyEditor, chartVisible, chartForm, chartPreview, openChartDialog, insertChart,
            aiVisible, aiType, aiCount, aiDifficulty, aiMaterial, aiDrafts, aiLoading, aiImporting, aiChecked, aiCheckAll, aiEditVisible, aiEditForm, materials, aiMaterialId, openAi, aiRun, materialUpload, materialDelete, aiEdit, aiImport }
    }
})

                        <el-button size="small" @click="searchQuestions">搜索</el-button>
                    </div>
                    <el-table :data="questions" border stripe @selection-change="onSelect" ref="qTable" max-height="300">
                        <el-table-column type="selection" width="50"/>
                        <el-table-column prop="id" label="ID" width="60"/>
                        <el-table-column prop="type" label="题型" width="100"><template #default="{row}">{{TYPE_MAP[row.type]}}</template></el-table-column>
                        <el-table-column prop="content" label="题干" show-overflow-tooltip><template #default="{row}">{{stripHtml(row.content)}}</template></el-table-column>
                        <el-table-column prop="difficulty" label="难度" width="80"><template #default="{row}"><el-tag :type="DIFF_MAP[row.difficulty]?.type" size="small">{{DIFF_MAP[row.difficulty]?.label}}</el-tag></template></el-table-column>
                    </el-table>
                </el-form-item>
                <el-form-item label="已选题目">
                    <div v-if="selected.length" style="display:flex;align-items:center;gap:8px">

                        <el-tag type="warning" size="small">总分 {{totalScore}} 分</el-tag>
                        <el-button size="small" type="primary" link @click="selVisible = true">管理已选题目</el-button>
                    </div>
                    <p v-else style="color:#909399">请在题目列表中勾选</p>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="submit" :loading="submitting">布置作业</el-button>
                    <el-button @click="reset">重置</el-button>
                </el-form-item>
            </el-form>
            <el-dialog title="已选题目管理" v-model="selVisible" width="820px">
                <el-table :data="selected" border stripe max-height="420">
                    <el-table-column type="index" label="#" width="50"/>
                    <el-table-column prop="id" label="ID" width="60"/>
                    <el-table-column prop="type" label="题型" width="100"><template #default="{row}">{{TYPE_MAP[row.type]}}</template></el-table-column>
                    <el-table-column prop="content" label="题干" show-overflow-tooltip><template #default="{row}">{{stripHtml(row.content)}}</template></el-table-column>
                    <el-table-column label="分值" width="150"><template #default="{row}"><el-input-number v-model="row.pickScore" :min="1" :max="100" size="small" style="width:110px" controls-position="right"/></template></el-table-column>
                    <el-table-column label="操作" width="80"><template #default="{row}"><el-button size="small" type="danger" link @click="removeSelected(row)">移除</el-button></template></el-table-column>
                </el-table>
            </el-dialog>
        </div>`,
    setup(props, {emit}) {
        const form = reactive({title:'',description:'',teachingClassId:null,deadline:''})
        const tcList = ref([]), questions = ref([]), selected = ref([]), qKeyword = ref(''), qType = ref(''), submitting = ref(false), selVisible = ref(false)
        const availableTcList = computed(() => tcList.value.filter(tc => (tc.studentCount || 0) > 0))
        const totalScore = computed(() => selected.value.reduce((a, q) => a + (Number(q.pickScore) || 0), 0))
        const searchQuestions = async () => { try { const r = await api.searchQuestions({page:1,size:100,keyword:qKeyword.value,type:qType.value}); questions.value = r.data.data.records } catch(e) { console.error(e) } }
        const onSelect = sel => {
            // 勾选变化全量重建，但保留已在弹窗内调整过的分值（pickScore）
            selected.value = sel.map(q => {
                const exist = selected.value.find(s => s.id === q.id)
                return {...q, pickScore: exist ? exist.pickScore : (q.score||5)}
            })
        }
        // 弹窗内移除：同时取消主表勾选（toggleRowSelection 触发 selection-change → onSelect 重建）
        const removeSelected = q => {
            const idx = selected.value.indexOf(q)
            if (idx > -1) selected.value.splice(idx, 1)
            qTable.value.toggleRowSelection(q, false)
            if (!selected.value.length) selVisible.value = false
        }
        const submit = async () => {
            if (!form.title||!form.teachingClassId||!form.deadline||!selected.value.length) { $m('请填写完整信息','error'); return }
            submitting.value = true
            try {
                const d = { title: form.title, description: form.description, teachingClassId: form.teachingClassId, deadline: form.deadline,
                    questions: selected.value.map((q,i) => ({questionId: q.id, sortOrder: i+1, score: q.pickScore})) }
                await api.assignHomework(d); $m('布置成功'); reset(); emit('assigned')
            } catch(e) { $m(e.response?.data?.msg||'布置失败','error') } finally { submitting.value = false }
        }
        const reset = () => { Object.assign(form, {title:'',description:'',teachingClassId:null,deadline:''}); selected.value = []; questions.value = []; selVisible.value = false }
        onMounted(async () => { try { const r = await api.teacherTeachingClasses({page:1,size:50}); tcList.value = r.data.data.records } catch(e) { console.error(e) } })
        return { form, tcList, availableTcList, totalScore, questions, selected, qKeyword, qType, submitting, selVisible, searchQuestions, onSelect, removeSelected, submit, reset, TYPE_MAP, DIFF_MAP }
    }
})

                <el-button size="large" @click="viewingHw=false;viewingResult=false;answers=[]">返回列表</el-button>
            </div>

            <!-- 查看结果 -->
            <div class="section-card" v-if="viewingResult">
                <h3>作业结果</h3>
                <p style="color:#909399;margin-bottom:8px">总分: {{result?.submission?.totalScore||0}} | 客观题: {{result?.submission?.autoScore||0}} | 主观题: {{result?.submission?.manualScore||0}}</p>
                <el-divider/>
                <div v-for="(a,i) in (result?.answers||[])" :key="i" style="margin-bottom:12px;padding:12px;background:#fafafa;border-radius:6px">
                    <p><b>{{i+1}}.</b> 你的答案: <span :style="{color: a.score>0?'#67c23a':'#f56c6c'}">{{a.studentAnswer||'(未作答)'}}</span></p>
                    <p>得分: {{a.score||0}} <span v-if="a.comment" style="color:#909399">| 评语: {{a.comment}}</span></p>
                </div>
                <el-button size="large" @click="viewingResult=false;viewingHw=false">返回列表</el-button>
            </div>
        </div>`,
    setup() {
        const list = ref([]), tab = ref('new'), loading = ref(false), viewingHw = ref(false), viewingResult = ref(false)
        const currentHw = ref(null), questions = ref([]), answers = ref([]), submitting = ref(false), result = ref(null)
        const load = async () => { loading.value = true; try { const r = await api.studentHomeworks({page:1,size:50}); list.value = r.data.data.records } catch(e) { console.error(e) } finally { loading.value = false } }
        const filteredList = computed(() => {
            return list.value.filter(h => {
                if (tab.value === 'new') return h.status === 'NOT_SUBMITTED' || h.status === 'SUBMITTED'
                return h.status === 'GRADED' || h.status === 'CLOSED'
            })
        })
        const openHw = async row => {
            viewingHw.value = true; viewingResult.value = false; currentHw.value = row
            try { const r = await api.studentHomeworkDetail(row.id); questions.value = r.data.data.questions||[]; answers.value = new Array(questions.value.length).fill('') } catch(e) { $m('加载失败','error') }
            // 题干富文本渲染（v-html 注入后扫描 ECharts 图表/代码高亮）
            await nextTick()
            document.querySelectorAll('.q-content').forEach(renderRich)
        }
        const viewResult = async row => {
            viewingResult.value = true; viewingHw.value = false; currentHw.value = row
            try { const r = await api.homeworkResult(row.id); result.value = r.data.data } catch(e) { $m('加载失败','error') }
        }
        const canSubmit = computed(() => currentHw.value && questions.value.length > 0)
        const doSubmit = async () => {
            // homeworkId 必须随 body 提交：SubmissionDto 的 @NotNull 校验先于 Controller 内 setHomeworkId 执行，
            // 不传会 400"提交失败"（@Valid 在进入方法体前完成校验）
            const d = { homeworkId: currentHw.value.id, answers: questions.value.map((q,i) => ({questionId: q.id, answer: Array.isArray(answers.value[i]) ? answers.value[i].join('') : (answers.value[i]||'')})) }
            submitting.value = true
            try { await api.submitHomework(currentHw.value.id, d); $m('提交成功'); viewingHw.value = false; load() } catch(e) { $m(e.response?.data?.msg||'提交失败','error') }
            finally { submitting.value = false }
        }
        const formatD = d => d ? d.substring(0,16) : ''
        const statusTag = s => ({NOT_SUBMITTED:'info',SUBMITTED:'warning',GRADED:'success',CLOSED:'info'}[s]||'')
        const statusLabel = s => ({NOT_SUBMITTED:'未提交',SUBMITTED:'已提交',GRADED:'已批改',CLOSED:'已关闭'}[s]||s)
        onMounted(load)
        return { list, tab, loading, viewingHw, viewingResult, currentHw, questions, answers, submitting, result, filteredList, load, openHw, viewResult, canSubmit, doSubmit, formatD, statusTag, statusLabel, TYPE_MAP }
    }
})

const LoginView = defineComponent({
    template: `
        <div class="login-container">
            <div class="login-card">
                <h1>📚 在线作业系统</h1>
                <el-tabs v-model="tab" stretch>
                    <el-tab-pane label="登 录" name="login">
                        <el-form :model="form" :rules="rules" ref="formRef">
                            <el-form-item prop="username">
                                <el-input v-model="form.username" placeholder="用户名" size="large" clearable/>
                            </el-form-item>
                            <el-form-item prop="password">
                                <el-input v-model="form.password" placeholder="密码" type="password" size="large" show-password @keyup.enter="doLogin"/>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" size="large" style="width:100%" @click="doLogin" :loading="loading">登 录</el-button>
                            </el-form-item>
                        </el-form>
                        <div style="text-align:center;color:#909399;font-size:12px">
                            测试账号：admin / T2024001 / 20240001<br>密码统一：Admin123456
                        </div>
                    </el-tab-pane>
                    <el-tab-pane label="注 册" name="register">
                        <el-form :model="regForm" :rules="regRules" ref="regFormRef">
                            <el-form-item prop="username">
                                <el-input v-model="regForm.username" placeholder="用户名（3-20位字母/数字/下划线）" size="large" clearable/>
                            </el-form-item>
                            <el-form-item prop="email">
                                <el-input v-model="regForm.email" placeholder="邮箱（用于接收验证码）" size="large" clearable/>
                            </el-form-item>
                            <el-form-item prop="code">
                                <div style="display:flex;width:100%;gap:8px">
                                    <el-input v-model="regForm.code" placeholder="邮箱验证码" size="large" style="flex:1"/>
                                    <el-button size="large" :disabled="countdown > 0 || regSending" @click="sendCode" style="width:140px">
                                        {{ countdown > 0 ? countdown + 's 后重发' : '获取验证码' }}
                                    </el-button>
                                </div>
                            </el-form-item>
                            <el-form-item prop="password">
                                <el-input v-model="regForm.password" placeholder="密码（至少8位，含大小写字母和数字）" type="password" size="large" show-password/>
                            </el-form-item>
                            <el-form-item prop="confirm">
                                <el-input v-model="regForm.confirm" placeholder="确认密码" type="password" size="large" show-password/>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="success" size="large" style="width:100%" @click="doRegister" :loading="regLoading">注 册</el-button>
                            </el-form-item>
                        </el-form>
                        <div style="text-align:center;color:#909399;font-size:12px">注册成功后将自动开通学生账号，可直接登录</div>
                    </el-tab-pane>
                </el-tabs>
            </div>
        </div>`,
    setup() {
        const router = useRouter()
        const tab = ref('login')
        const form = reactive({username:'',password:''})
        const rules = {username:[{required:true,message:'请输入用户名'}],password:[{required:true,message:'请输入密码'}]}
        const formRef = ref(null), loading = ref(false)
        const doLogin = async () => {
            if (!formRef.value) return
            try {
                await formRef.value.validate()
            } catch (e) { return }
            loading.value = true
            try {
                const r = await api.login({username:form.username,password:form.password})
                if (r.data.code !== 200) { $m(r.data.msg || '登录失败', 'error'); return }
                const t = r.data.data.token
                localStorage.setItem('token', t)
                let u
                try {
                    const me = await axios.get('/api/auth/me')
                    u = {username:me.data.data.username, realName:me.data.data.realName, role:me.data.data.role, pwdResetRequired: me.data.data.pwdResetRequired}
                } catch(e) {
                    u = {username:form.username, realName:form.username, role:r.data.data.role, pwdResetRequired: r.data.data.pwdResetRequired}
                }
                localStorage.setItem('userInfo', JSON.stringify(u))
                router.push(defaultPath(u.role))
            } catch(e) { $m(e.response?.data?.msg || '登录失败','error') } finally { loading.value = false }
        }
        // ===== 注册 =====
        const regForm = reactive({username:'',email:'',code:'',password:'',confirm:''})
        const regFormRef = ref(null), regLoading = ref(false), regSending = ref(false), countdown = ref(0)
        let timer = null
        const EMAIL_RE = /^[\w.+-]+@[\w-]+(\.[\w-]+)+$/
        const regRules = {
            username: [
                {required:true,message:'请输入用户名'},
                {pattern:/^[a-zA-Z0-9_]{3,20}$/,message:'3-20位字母/数字/下划线'}
            ],
            email: [
                {required:true,message:'请输入邮箱'},
                {pattern:EMAIL_RE,message:'邮箱格式不正确'}
            ],
            code: [{required:true,message:'请输入验证码'},{pattern:/^\d{6}$/,message:'验证码为6位数字'}],
            password: [
                {required:true,message:'请输入密码'},
                {pattern:/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/,message:'至少8位，含大小写字母和数字'}
            ],
            confirm: [
                {required:true,message:'请确认密码'},
                {validator:(rule,val,cb)=> val !== regForm.password ? cb(new Error('两次输入的密码不一致')) : cb(), trigger:'blur'}
            ]
        }
        const sendCode = async () => {
            if (!EMAIL_RE.test(regForm.email)) return $m('请先输入正确的邮箱','error')
            regSending.value = true
            try {
                const r = await api.sendVerificationCode({email: regForm.email})
                $m(r.data.msg || '验证码已发送','success')
                countdown.value = 60
                timer = setInterval(() => { if (--countdown.value <= 0) clearInterval(timer) }, 1000)
            } catch(e) { $m(e.response?.data?.msg || '发送失败','error') } finally { regSending.value = false }
        }
        const doRegister = async () => {
            if (!regFormRef.value) return
            try {
                await regFormRef.value.validate()
            } catch (e) { return }
            regLoading.value = true
            try {
                const r = await api.register({username:regForm.username, email:regForm.email, password:regForm.password, code:regForm.code})
                $m(r.data.msg || '注册成功','success')
                tab.value = 'login'
                form.username = regForm.username
                Object.assign(regForm, {username:'',email:'',code:'',password:'',confirm:''})
            } catch(e) { $m(e.response?.data?.msg || '注册失败','error') } finally { regLoading.value = false }
        }
        return { tab, form, rules, formRef, loading, doLogin, regForm, regRules, regFormRef, regLoading, regSending, countdown, sendCode, doRegister }
    }
})

// ======== 路由 ========
const defaultPath = role => ({ADMIN:'/dashboard',TEACHER:'/myHomeworks',STUDENT:'/myHw'}[role] || '/login')

const routes = [
    { path: '/login', component: LoginView },
    {
        path: '/',
        component: MainLayout,
        redirect: () => defaultPath((JSON.parse(localStorage.getItem('userInfo')||'{}')).role),
        children: [
            { path: 'dashboard', component: AdminDashboard, meta: {roles:['ADMIN']} },
            { path: 'teachers', component: AdminTeachers, meta: {roles:['ADMIN']} },
            { path: 'classes', component: AdminClasses, meta: {roles:['ADMIN']} },
            { path: 'students', component: AdminStudents, meta: {roles:['ADMIN']} },
            { path: 'questions', component: AdminQuestions, meta: {roles:['ADMIN']} },
            { path: 'knowledge', component: AdminKnowledge, meta: {roles:['ADMIN']} },
            { path: 'tcAdmin', component: AdminTeachingClasses, meta: {roles:['ADMIN']} },
            { path: 'teachingClasses', component: TeacherTeachingClasses, meta: {roles:['TEACHER']} },
            { path: 'myHomeworks', component: TeacherHomeworks, meta: {roles:['TEACHER']} },
            { path: 'assignHw', component: TeacherAssign, meta: {roles:['TEACHER']} },
            { path: 'grading', component: TeacherGrading, meta: {roles:['TEACHER']} },
            { path: 'myHw', component: StudentHomeworks, meta: {roles:['STUDENT']} },
        ]
    },
    { path: '/:pathMatch(.*)*', redirect: '/' }
]

const router = createRouter({
    history: createWebHistory(),
    routes
})

// 登录守卫：未登录 → /login；已登录访问 /login → 默认页；角色不匹配 → 默认页
router.beforeEach(to => {
    const token = localStorage.getItem('token')
    const role = (JSON.parse(localStorage.getItem('userInfo')||'{}')).role
    if (to.path === '/login') {
        return token ? defaultPath(role) : true
    }
    if (!token) return '/login'
    if (to.meta.roles && !to.meta.roles.includes(role)) return defaultPath(role)
    return true
})

const app = createApp({})
app.use(ElementPlus)
app.use(router)
app.mount('#app')
</script>
