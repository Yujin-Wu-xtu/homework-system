server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # === H2 内嵌数据库（开发/演示环境） ===
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:homework;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # === MySQL（生产环境，取消注释使用）===
  # datasource:
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://localhost:3306/homework_system?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
  #   username: root
  #   password: ${DB_PASSWORD:root}
  #   type: com.alibaba.druid.pool.DruidDataSource

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForJWTTokenGeneration2026!@#$%^&*()}
  expiration: 7200000  # 2小时

knife4j:
  enable: true
