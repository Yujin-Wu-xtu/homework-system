server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # === 邮箱（注册验证码，QQ SMTP；授权码从环境变量 MAIL_AUTH_CODE 注入，勿入库）===
  # 代理见 MailConfig：仅当设置 MAIL_PROXY_HOST/MAIL_PROXY_PORT 环境变量时启用（默认纯直连，QQ SMTP 国内直连畅通）
  mail:
    host: smtp.qq.com
    port: 465
    username: 3062424485@qq.com
    password: ${MAIL_AUTH_CODE:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  # === MySQL（主数据库：本地 XAMPP MariaDB / 生产 Docker MySQL）===
  # host/port 也走环境变量（Docker 部署 MySQL 在独立容器/远程库时 localhost 连不上）：
  #   DB_HOST=mysql DB_PORT=3306（compose 服务名）；本机默认 localhost:3306
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/homework_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      mode: never

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # SQL 日志可切换：开发默认 StdOutImpl（便于排障）；生产 compose 设
    # MYBATIS_LOG_IMPL=org.apache.ibatis.logging.slf4j.Slf4jImpl 静默（压测性能/日志量）
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForJWTTokenGeneration2026!@#$%^&*()}
  expiration: 7200000  # 2小时

knife4j:
  enable: true

ai:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
