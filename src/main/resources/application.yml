server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # === MySQL（主数据库：本地 XAMPP MariaDB / 生产 Docker MySQL）===
  # 本机 XAMPP root 默认空密码；生产环境用环境变量注入: set DB_PASSWORD=xxx
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/homework_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      mode: never

  # === H2 内嵌数据库（无 MySQL 时的演示备选：注释上方 MySQL 块并取消本块注释）===
  # datasource:
  #   driver-class-name: org.h2.Driver
  #   url: jdbc:h2:mem:homework;MODE=MySQL;DB_CLOSE_DELAY=-1
  #   username: sa
  #   password:
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForJWTTokenGeneration2026!@#$%^&*()}
  expiration: 7200000  # 2小时

knife4j:
  enable: true
